# 修改 NFS_SERVER_IP 后应用。NFS 导出目录由控制节点或存储节点提供。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: platform-workspaces
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1]
  nfs:
    server: NFS_SERVER_IP
    path: /data/workspaces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-workspaces
  namespace: default
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: platform-workspaces
  resources:
    requests:
      storage: 100Gi
