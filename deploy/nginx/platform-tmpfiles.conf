# Ubuntu package nginx workers run as www-data. Keep upload/proxy spool writable.
d /var/lib/nginx/body 0700 www-data www-data -
d /var/lib/nginx/proxy 0700 www-data www-data -
d /var/lib/nginx/fastcgi 0700 www-data www-data -
d /var/lib/nginx/uwsgi 0700 www-data www-data -
d /var/lib/nginx/scgi 0700 www-data www-data -
