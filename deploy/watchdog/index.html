<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台独立监测记录</title>
<style>body{font:16px system-ui,sans-serif;max-width:880px;margin:48px auto;padding:0 24px;color:#243041;background:#f6f8fb}article{background:white;padding:20px;margin:16px 0;border:1px solid #dbe1ea;border-radius:12px}small{color:#657287}h2{font-size:18px}a{color:#3159a5}</style>
<h1>平台独立监测记录</h1><p>这里展示服务与节点故障记录，不依赖业务接口。</p><p id="state">正在读取…</p><main id="events"></main><p><a href="/">返回平台</a></p>
<script>
async function refresh(){try{const r=await fetch('status.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const age=Date.now()/1000-d.generated_at;document.getElementById('state').textContent=age>120?'监测记录暂未更新，请检查监测服务。':'最近更新：'+new Date(d.generated_at*1000).toLocaleString();const box=document.getElementById('events');box.replaceChildren();for(const e of d.incidents.slice().reverse()){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),s=document.createElement('small');h.textContent=e.title+' · '+(e.active?'仍在检测到异常':'检测项已恢复');p.textContent=e.message;s.textContent='首次发现：'+new Date(e.first_seen*1000).toLocaleString();a.append(h,p,s);box.append(a)}if(!d.incidents.length)box.textContent='暂无故障记录。'}catch{document.getElementById('state').textContent='暂时无法读取监测记录，请检查网络或服务。'}}refresh();setInterval(refresh,30000)
</script></html>
